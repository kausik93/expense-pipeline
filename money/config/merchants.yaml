# from your historical categorized tabs, then freely hand-editable.
#
# Keys are stable merchant keys (see pipeline/text.py::merchant_key). At
# runtime, the LONGEST key that is a whole-token run inside a transaction's
# merchant key wins. Add or correct a line and it takes effect on the next run.
